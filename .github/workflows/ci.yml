name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run pytest -q
      - name: Build live index
        run: uv run anydocs-build
      - name: Gate retrieval quality
        run: uv run python scripts/eval_search.py --verbose
      - name: Verify anchors against the live sites
        # Hard gate here, advisory in sync.yml: on a PR the diff is code, so a
        # broken slug convicts the change; in the daily sync only the upstream
        # docs moved, and that must not block a publish.
        run: uv run python scripts/verify_anchors.py
